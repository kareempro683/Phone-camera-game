<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0a16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Hand Magic</title>
<style>
/* Layout: full-screen camera with the hand skeleton, a floating top line, and one bottom toolbar. */
:root {
  --ink: #0b0a16;
  --bar: rgba(14, 12, 30, .88);
  --btn: #26214a;
  --btn-on: #6d3cff;
  --text: #f3f0ff;
  --muted: #aaa2d6;
  --warn: #ffe15c;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); font: 15px/1.35 var(--font);
  overflow: hidden; touch-action: none; user-select: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
video { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; }

#top { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 8px; align-items: center; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); }
.pill { background: rgba(10, 8, 24, .6); border: 1px solid rgba(255, 255, 255, .14); border-radius: 999px;
  padding: 6px 12px; font-size: 13px; font-weight: 700; backdrop-filter: blur(6px); }
#top .grow { flex: 1; }

#bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  padding: 10px max(10px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(10px, env(safe-area-inset-left, 0px));
  background: linear-gradient(transparent, rgba(11, 10, 22, .9) 35%); }
.b { border: 1px solid rgba(255, 255, 255, .1); background: var(--btn); color: var(--text); border-radius: 14px;
  padding: 10px 13px; font: 800 14px var(--font); display: inline-flex; align-items: center; gap: 7px; }
.b.on { background: var(--btn-on); box-shadow: 0 0 16px rgba(109, 60, 255, .7); }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; display: inline-block; }

#sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bar); backdrop-filter: blur(10px);
  border-radius: 22px 22px 0 0; border-top: 1px solid rgba(255, 255, 255, .12);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 12px; touch-action: none; }
#sheet h2 { margin: 0; font-size: 17px; }
#wheel { width: min(240px, 62vw); height: min(240px, 62vw); touch-action: none; }
#bright { width: min(300px, 80vw); accent-color: var(--btn-on); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .7); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
#preview { width: 42px; height: 42px; border-radius: 50%; border: 3px solid #fff; }

#start { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; text-align: center; padding: 24px max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px));
  background: radial-gradient(circle at 50% 35%, #2a1260, var(--ink) 70%); }
#start h1 { margin: 0; font-size: 46px; line-height: 1; letter-spacing: -.02em;
  background: linear-gradient(90deg, #3ef2e0, #9a7bff, #ff4fa3); -webkit-background-clip: text; background-clip: text; color: transparent; }
#start p { margin: 0; color: var(--muted); max-width: 32ch; }
#go { border: 0; border-radius: 18px; padding: 16px 38px; font: 800 20px var(--font); color: #fff;
  background: linear-gradient(90deg, #6a3cff, #c43cff); box-shadow: 0 0 30px rgba(140, 80, 255, .7); }
#go:disabled { opacity: .6; }
#status { color: var(--warn); font-weight: 700; min-height: 1.4em; max-width: 34ch; }
#ver { color: var(--muted); font-size: 12px; }
#toast { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); font-size: 24px; font-weight: 900; text-align: center;
  text-shadow: 0 0 10px #000, 0 0 3px #000; pointer-events: none; transition: opacity .3s; opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted autoplay></video>

<div id="top">
  <span class="pill" id="hint">Loading...</span>
  <span class="grow"></span>
  <span class="pill" id="fps"></span>
</div>

<div id="bar">
  <button class="b" id="drawBtn">✏️ Drawing: On</button>
  <button class="b" id="skelBtn"><span class="dot" id="skelDot"></span>Skeleton</button>
  <button class="b" id="penBtn"><span class="dot" id="penDot"></span>Pen</button>
  <button class="b" id="modeBtn">Draw with: Finger</button>
  <button class="b" id="sizeBtn">Size: M</button>
  <button class="b" id="handsBtn">Hands: 2</button>
  <button class="b" id="undoBtn">Undo</button>
  <button class="b" id="clearBtn">Clear</button>
  <button class="b" id="flipBtn">⟲</button>
</div>

<div id="sheet" hidden>
  <h2 id="sheetTitle">Skeleton color</h2>
  <canvas id="wheel" width="440" height="440"></canvas>
  <input id="bright" type="range" min="10" max="100" value="100" aria-label="Brightness">
  <div class="swatches" id="quick"></div>
  <div class="row">
    <span id="preview"></span>
    <button class="b" id="rainbowBtn">🌈 Rainbow: Off</button>
    <button class="b on" id="doneBtn">Done</button>
  </div>
</div>

<div id="toast"></div>

<div id="start">
  <h1>Hand Magic</h1>
  <p>Draw in the air with your fingers. Pick any color for your hand skeleton and your pen.</p>
  <button id="go">Start</button>
  <div id="status"></div>
  <div id="startBtns" hidden><button class="b" id="retryBtn">Try again</button> <button class="b" id="fixBtn">Fix problems</button></div>
  <div id="ver">Simple version 3</div>
</div>

<script>
"use strict";
const VERSION = "simple-3";
// ---------------- settings (remembered on this phone)
const S = { draw: 1, mode: 0, hands: 1, size: 1, skel: { h: 285, s: .8, v: 1, rb: 0 }, pen: { h: 180, s: 1, v: 1, rb: 0 }, cam: "user" };
try { const s = JSON.parse(localStorage.getItem("hm-simple") || "{}"); for (const k in s) if (k in S) S[k] = (typeof S[k] === "object") ? Object.assign(S[k], s[k]) : s[k]; } catch (e) {}
const save = () => { try { localStorage.setItem("hm-simple", JSON.stringify(S)); } catch (e) {} };

// ---------------- color helpers
function hsv(h, s, v) {
  h = ((h % 360) + 360) % 360;
  const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return [Math.round(f(5) * 255), Math.round(f(3) * 255), Math.round(f(1) * 255)];
}
let now = 0;
const colorOf = (c, off = 0) => c.rb ? hsv(now * 120 + off, 1, 1) : hsv(c.h, c.s, c.v);
const css = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ---------------- canvas
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const ink = document.createElement("canvas"), ictx = ink.getContext("2d");
const video = document.getElementById("v");
let W = 0, H = 0, DPR = 1, map = { s: 1, ox: 0, oy: 0, dw: 0, dh: 0 };
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 1.5);
  let w = Math.round(innerWidth * DPR), h = Math.round(innerHeight * DPR);
  const k = Math.min(1, 1000 / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
  if (w === W && h === H) return;
  let old = null; try { if (W) old = ictx.getImageData(0, 0, W, H); } catch (e) {}
  W = cv.width = ink.width = w; H = cv.height = ink.height = h;
  if (old) ictx.putImageData(old, 0, 0);
  fitVideo();
}
function fitVideo() {
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480, s = Math.max(W / vw, H / vh);
  map = { s, dw: vw * s, dh: vh * s, ox: (W - vw * s) / 2, oy: (H - vh * s) / 2 };
}
const mirror = () => S.cam === "user";
const toPx = (nx, ny) => [(mirror() ? 1 - nx : nx) * map.dw + map.ox, ny * map.dh + map.oy];
addEventListener("resize", resize);

// ---------------- background tracker
let prevHands = [], prevResultAt = 0, rateTimes = [], resultCount = 0, worker = null, trackerReady = false, waiting = false, sentAt = 0, restarts = 0, lastHands = [], lastResultAt = 0;
const problems = [];
const frameCv = document.createElement("canvas"), fctx = frameCv.getContext("2d", { willReadFrequently: true });
let onReady = null, onFail = null;
function startWorker() {
  trackerReady = false; waiting = false;
  try { worker = new Worker("worker.js?v=" + VERSION); }
  catch (e) { onFail && onFail("background helper didn't start: " + e.message); return; }
  worker.onmessage = e => {
    const m = e.data || {};
    if (m.type === "progress") status(m.msg);
    else if (m.type === "ready") { trackerReady = true; worker.postMessage({ maxHands: S.hands }); onReady && onReady(m.backend); }
    else if (m.type === "fail") { onFail && onFail(m.msg); }
    else if (m.type === "error") { problems.push(m.msg); if (problems.length > 5) problems.shift(); }
    else if (m.type === "result") { waiting = false; if (!m.skipped) { prevHands = lastHands; prevResultAt = lastResultAt; lastHands = m.hands; lastResultAt = performance.now(); resultCount++; rateTimes.push(lastResultAt); } }
  };
  worker.onerror = e => { if (e.preventDefault) e.preventDefault(); problems.push("helper crashed: " + (e.message || "")); restartWorker(); };
}
function restartWorker() {
  try { worker && worker.terminate(); } catch (e) {}
  worker = null; restarts++;
  if (restarts > 5) { toast("Hand tracking keeps stopping. Tap ⟲ or reopen the app"); return; }
  const wasReady = trackerReady;
  onReady = wasReady ? () => {} : onReady;
  startWorker();
}
function sendFrame() {
  if (!trackerReady || !worker || !video.videoWidth) return;
  if (waiting) { if (performance.now() - sentAt > 8000) restartWorker(); return; }
  const vw = video.videoWidth, vh = video.videoHeight, k = Math.min(1, 384 / Math.max(vw, vh));
  const w = Math.round(vw * k), h = Math.round(vh * k);
  if (frameCv.width !== w || frameCv.height !== h) { frameCv.width = w; frameCv.height = h; }
  fctx.drawImage(video, 0, 0, w, h);
  let img; try { img = fctx.getImageData(0, 0, w, h); } catch (e) { return; }
  waiting = true; sentAt = performance.now();
  worker.postMessage({ frame: img }, [img.data.buffer]);
}

// ---------------- smoothing (steady when still, quick when moving)
class Smooth {
  constructor() { this.x = null; }
  run(a, t) {
    if (!this.x || t - this.t > .5) { this.x = a.slice(); this.d = a.map(() => 0); this.t = t; return a; }
    const dt = Math.max(.001, t - this.t); this.t = t;
    const al = c => 1 / (1 + 1 / (2 * Math.PI * c * dt));
    for (let i = 0; i < a.length; i++) {
      const d = (a[i] - this.x[i]) / dt; this.d[i] += al(1) * (d - this.d[i]);
      this.x[i] += al(6 + .05 * Math.abs(this.d[i]) / DPR) * (a[i] - this.x[i]);
    }
    return this.x.slice();
  }
}
let tracks = []; // {f: Smooth, pts, seen, pen}
function predicted() {
  // move each hand ahead along its recent motion, so the skeleton keeps up with your real hand
  const t = performance.now();
  if (t - lastResultAt > 500) return [];
  const gap = lastResultAt - prevResultAt;
  const ahead = Math.min(t - lastResultAt + gap * .5, 160);
  return lastHands.map(h => {
    if (!(gap > 0 && gap < 400)) return h;
    let best = null, bd = Infinity;
    for (const q of prevHands) { const d = Math.hypot(q[0][0] - h[0][0], q[0][1] - h[0][1]); if (d < bd) { bd = d; best = q; } }
    if (!best || bd > .2) return h;
    return h.map((p, i) => [p[0] + (p[0] - best[i][0]) / gap * ahead, p[1] + (p[1] - best[i][1]) / gap * ahead]);
  });
}
function updateHands() {
  const fresh = predicted();
  const out = [];
  const free = tracks.slice();
  for (const h of fresh) {
    const px = h.map(([x, y]) => toPx(x, y));
    let best = null, bd = Infinity;
    for (const t of free) { const d = Math.hypot(t.pts[0][0] - px[0][0], t.pts[0][1] - px[0][1]); if (d < bd) { bd = d; best = t; } }
    if (!best || bd > W * .35) best = { f: new Smooth(), pts: px, pen: null };
    else free.splice(free.indexOf(best), 1);
    const flat = best.f.run(px.flat(), now);
    best.pts = []; for (let i = 0; i < 21; i++) best.pts.push([flat[i * 2], flat[i * 2 + 1]]);
    best.seen = now; out.push(best);
  }
  for (const t of free) if (now - (t.seen || 0) < .25) out.push(t);
  tracks = out;
}

// ---------------- drawing
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
const undo = [];
function pushUndo() { try { undo.push(ictx.getImageData(0, 0, W, H)); if (undo.length > 12) undo.shift(); } catch (e) {} }
function drawSkeleton(t) {
  const p = t.pts, w = [3, 5, 8][S.size] * DPR;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  const one = !S.skel.rb;
  if (one) {
    const c = colorOf(S.skel);
    ctx.beginPath(); for (const [a, b] of BONES) { ctx.moveTo(...p[a]); ctx.lineTo(...p[b]); }
    ctx.strokeStyle = css(c, .3); ctx.lineWidth = w * 3; ctx.stroke();
    ctx.strokeStyle = css(c); ctx.lineWidth = w; ctx.stroke();
  } else {
    for (const [a, b] of BONES) {
      const c = colorOf(S.skel, a * 12);
      ctx.beginPath(); ctx.moveTo(...p[a]); ctx.lineTo(...p[b]);
      ctx.strokeStyle = css(c, .3); ctx.lineWidth = w * 3; ctx.stroke();
      ctx.strokeStyle = css(c); ctx.lineWidth = w; ctx.stroke();
    }
  }
  ctx.fillStyle = "#fff"; ctx.beginPath();
  for (const q of p) { ctx.moveTo(q[0] + w * .45, q[1]); ctx.arc(q[0], q[1], w * .45, 0, 6.283); }
  ctx.fill();
}
function fingerUp(p, tip, pip) { return Math.hypot(p[tip][0] - p[0][0], p[tip][1] - p[0][1]) > Math.hypot(p[pip][0] - p[0][0], p[pip][1] - p[0][1]) * 1.12; }
function wantsToDraw(t) {
  const p = t.pts, size = Math.hypot(p[0][0] - p[9][0], p[0][1] - p[9][1]) || 1;
  if (S.mode === 0) {
    // pointing: index finger out, middle and ring fingers folded
    return fingerUp(p, 8, 6) && !fingerUp(p, 12, 10) && !fingerUp(p, 16, 14);
  }
  const d = Math.hypot(p[4][0] - p[8][0], p[4][1] - p[8][1]) / size;
  return t.pinched ? d < .55 : d < .35; // easier to keep a pinch than to start one
}
function handleDrawing(t) {
  const p = t.pts;
  const want = S.draw && wantsToDraw(t);
  // only switch after it's been steady for a moment, so it doesn't flicker
  if (want !== t.pinched) { t.flipAt = t.flipAt || now; if (now - t.flipAt > .08) { t.pinched = want; t.flipAt = 0; } }
  else t.flipAt = 0;
  const tip = S.mode === 0 ? p[8] : [(p[4][0] + p[8][0]) / 2, (p[4][1] + p[8][1]) / 2];
  if (!t.pinched) { t.pen = null; t.lastMid = null; return false; }
  if (!t.pen) { pushUndo(); t.pen = tip; }
  const c = colorOf(S.pen), bw = [5, 10, 18][S.size] * DPR;
  const mid = [(t.pen[0] + tip[0]) / 2, (t.pen[1] + tip[1]) / 2];
  ictx.lineCap = ictx.lineJoin = "round";
  ictx.beginPath(); ictx.moveTo(...(t.lastMid || t.pen)); ictx.quadraticCurveTo(t.pen[0], t.pen[1], mid[0], mid[1]);
  ictx.strokeStyle = css(c, .25); ictx.lineWidth = bw * 2.6; ictx.stroke();
  ictx.strokeStyle = css(c); ictx.lineWidth = bw; ictx.stroke();
  t.lastMid = mid; t.pen = tip;
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2 * DPR; ctx.beginPath(); ctx.arc(tip[0], tip[1], bw * .8 + 4, 0, 6.283); ctx.stroke();
  return true;
}

// ---------------- main loop
let fpsN = 0, fpsT = 0;
function loop(ms) {
  requestAnimationFrame(loop);
  now = ms / 1000;
  if (++fpsN && now - fpsT > 1) {
    const t = performance.now(); rateTimes = rateTimes.filter(x => t - x < 2000);
    document.getElementById("fps").textContent = "Speed " + Math.round(rateTimes.length / 2) + (crossOriginIsolated ? " · all cores" : "");
    fpsN = 0; fpsT = now;
  }
  if (!video.videoWidth) return;
  if (Math.abs(map.dw / map.s - video.videoWidth) > 1) fitVideo();
  try {
    sendFrame();
    updateHands();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.save(); if (mirror()) { ctx.translate(W, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, map.ox, map.oy, map.dw, map.dh); ctx.restore();
    ctx.drawImage(ink, 0, 0);
    let drawing = false;
    for (const t of tracks) { drawSkeleton(t); if (handleDrawing(t)) drawing = true; }
    document.getElementById("hint").textContent = !trackerReady ? "Loading hand tracking..." :
      !tracks.length ? "Show your hand to the camera" : !S.draw ? "Drawing is off" : drawing ? "Drawing..." : S.mode === 0 ? "Point your finger to draw, open your hand to stop" : "Pinch your thumb and finger to draw";
  } catch (e) { problems.push(e.message); }
}

// ---------------- toolbar
const $ = id => document.getElementById(id);
function paintBar() {
  $("drawBtn").textContent = "✏️ Drawing: " + (S.draw ? "On" : "Off");
  $("drawBtn").classList.toggle("on", !!S.draw);
  $("sizeBtn").textContent = "Size: " + ["S", "M", "L"][S.size];
  $("modeBtn").textContent = "Draw with: " + (S.mode === 0 ? "Finger" : "Pinch");
  $("handsBtn").textContent = "Hands: " + S.hands;
  $("skelDot").style.background = S.skel.rb ? "conic-gradient(red,yellow,lime,cyan,blue,magenta,red)" : css(hsv(S.skel.h, S.skel.s, S.skel.v));
  $("penDot").style.background = S.pen.rb ? "conic-gradient(red,yellow,lime,cyan,blue,magenta,red)" : css(hsv(S.pen.h, S.pen.s, S.pen.v));
}
$("drawBtn").onclick = () => { S.draw ^= 1; save(); paintBar(); toast(S.draw ? "Drawing on" : "Drawing off"); };
$("sizeBtn").onclick = () => { S.size = (S.size + 1) % 3; save(); paintBar(); };
$("modeBtn").onclick = () => { S.mode ^= 1; save(); paintBar(); toast(S.mode === 0 ? "Point your finger to draw" : "Pinch to draw"); };
$("handsBtn").onclick = () => { S.hands = S.hands === 2 ? 1 : 2; save(); paintBar(); if (worker) worker.postMessage({ maxHands: S.hands }); toast(S.hands === 1 ? "1 hand (faster)" : "2 hands"); };
$("undoBtn").onclick = () => { const im = undo.pop(); if (im) ictx.putImageData(im, 0, 0); else toast("Nothing to undo"); };
$("clearBtn").onclick = () => { pushUndo(); ictx.clearRect(0, 0, W, H); toast("Cleared"); };
$("flipBtn").onclick = () => { S.cam = S.cam === "user" ? "environment" : "user"; save(); openCamera().catch(e => toast(cameraMsg(e))); };
$("skelBtn").onclick = () => openSheet("skel");
$("penBtn").onclick = () => openSheet("pen");

// ---------------- color picker
let target = "skel", wheelImg = null;
const wheel = $("wheel"), wctx = wheel.getContext("2d");
const QUICK = [[0, 1, 1], [30, 1, 1], [55, 1, 1], [120, 1, .9], [180, 1, 1], [215, 1, 1], [275, .9, 1], [320, .8, 1], [0, 0, 1], [0, 0, .25]];
$("quick").innerHTML = QUICK.map((c, i) => `<button class="sw" data-i="${i}" style="background:${css(hsv(...c))}" aria-label="color"></button>`).join("");
$("quick").onclick = e => { const b = e.target.closest("[data-i]"); if (!b) return; const [h, s, v] = QUICK[+b.dataset.i]; Object.assign(S[target], { h, s, v, rb: 0 }); $("bright").value = Math.round(v * 100); paintWheel(); };
function openSheet(t) {
  target = t; $("sheetTitle").textContent = t === "skel" ? "Skeleton color" : "Pen color";
  $("bright").value = Math.round(S[t].v * 100); $("sheet").hidden = false; $("bar").hidden = true; paintWheel();
}
function paintWheel() {
  if (!wheelImg) {
    wheelImg = wctx.createImageData(440, 440);
    for (let y = 0; y < 440; y++) for (let x = 0; x < 440; x++) {
      const dx = x - 220, dy = y - 220, d = Math.hypot(dx, dy), i = (y * 440 + x) * 4;
      if (d > 218) continue;
      const [r, g, b] = hsv(Math.atan2(dy, dx) * 180 / Math.PI, d / 218, 1);
      wheelImg.data[i] = r; wheelImg.data[i + 1] = g; wheelImg.data[i + 2] = b; wheelImg.data[i + 3] = 255;
    }
  }
  wctx.putImageData(wheelImg, 0, 0);
  const c = S[target], a = c.h * Math.PI / 180, x = 220 + Math.cos(a) * c.s * 218, y = 220 + Math.sin(a) * c.s * 218;
  wctx.lineWidth = 7; wctx.strokeStyle = "#000"; wctx.beginPath(); wctx.arc(x, y, 17, 0, 6.283); wctx.stroke();
  wctx.lineWidth = 4; wctx.strokeStyle = "#fff"; wctx.stroke();
  $("preview").style.background = c.rb ? "conic-gradient(red,yellow,lime,cyan,blue,magenta,red)" : css(hsv(c.h, c.s, c.v));
  $("rainbowBtn").textContent = "🌈 Rainbow: " + (c.rb ? "On" : "Off"); $("rainbowBtn").classList.toggle("on", !!c.rb);
  save(); paintBar();
}
function pickAt(e) {
  const r = wheel.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 440 - 220, y = (e.clientY - r.top) / r.height * 440 - 220;
  const c = S[target]; c.h = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360; c.s = Math.min(1, Math.hypot(x, y) / 218); c.rb = 0;
  paintWheel();
}
wheel.addEventListener("pointerdown", e => { wheel.setPointerCapture(e.pointerId); pickAt(e); });
wheel.addEventListener("pointermove", e => { if (e.buttons || e.pointerType === "touch") pickAt(e); });
$("bright").oninput = e => { S[target].v = e.target.value / 100; S[target].rb = 0; paintWheel(); };
$("rainbowBtn").onclick = () => { S[target].rb ^= 1; paintWheel(); };
$("doneBtn").onclick = () => { $("sheet").hidden = true; $("bar").hidden = false; };

// ---------------- messages
let toastT = 0;
function toast(m) { const t = $("toast"); t.textContent = m; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 1400); }
function status(m) { $("status").textContent = m; }

// ---------------- camera
let stream = null;
function cameraMsg(e) {
  const n = e && e.name;
  if (!window.isSecureContext) return "Open the https:// link: kareempro683.github.io/Phone-camera-game/";
  if (n === "NotAllowedError" || n === "SecurityError") return "The camera is blocked. Tap the icon next to the web address, set Camera to Allow, then tap Try again.";
  if (n === "NotReadableError" || n === "AbortError") return "Another app is using the camera. Close it, then tap Try again.";
  if (n === "NotFoundError" || n === "OverconstrainedError") return "No camera was found.";
  return "The camera didn't open (" + ((e && (e.message || n)) || "unknown") + "). Tap Try again.";
}
async function openCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw { name: "SecurityError" };
  if (stream) stream.getTracks().forEach(t => t.stop());
  let err = null;
  for (const v of [{ facingMode: S.cam, width: { ideal: 960 }, height: { ideal: 720 } }, { facingMode: S.cam }, true]) {
    try { stream = await navigator.mediaDevices.getUserMedia({ video: v, audio: false }); err = null; break; }
    catch (e) { err = e; if (e && e.name === "NotAllowedError") break; }
  }
  if (err) throw err;
  video.srcObject = stream; try { await video.play(); } catch (e) {}
  fitVideo();
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !$("start").hidden) return;
  const tr = stream && stream.getVideoTracks()[0];
  if (!tr || tr.readyState === "ended" || video.paused) openCamera().catch(e => toast(cameraMsg(e)));
});

// ---------------- start
async function fixProblems() {
  status("Fixing...");
  try { for (const k of await caches.keys()) await caches.delete(k); } catch (e) {}
  try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch (e) {}
  location.reload();
}
$("retryBtn").onclick = () => location.reload();
$("fixBtn").onclick = fixProblems;
let starting = false;
$("go").onclick = async () => {
  if (starting) return; starting = true;
  const go = $("go"); go.disabled = true; $("startBtns").hidden = true;
  const fail = m => { status(m); go.disabled = false; $("startBtns").hidden = false; starting = false; };
  try { status("Opening the camera..."); await openCamera(); } catch (e) { return fail(cameraMsg(e)); }
  const t0 = performance.now();
  const tick = setInterval(() => { if (!trackerReady) status("Loading hand tracking... " + Math.round((performance.now() - t0) / 1000) + "s"); }, 1000);
  const ok = await new Promise(res => {
    onReady = () => res(true);
    onFail = m => { problems.push(m); res(m); };
    startWorker();
    setTimeout(() => res("it took more than 3 minutes"), 180000);
  });
  clearInterval(tick);
  if (ok !== true) { try { worker && worker.terminate(); } catch (e) {} return fail("Hand tracking couldn't start: " + ok + ". Tap Fix problems, then Start. If it fails again, screenshot this for Claude."); }
  onFail = m => toast("Tracker problem: " + m);
  $("start").hidden = true; starting = false;
  try { await navigator.wakeLock.request("screen"); } catch (e) {}
};

resize(); paintBar(); requestAnimationFrame(loop);
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then(() => {
    // the helper switches on "all cores" mode; it needs one reload to take effect
    let tried = false; try { tried = sessionStorage.getItem("coi") === "1"; } catch (e) {}
    if (!crossOriginIsolated && !tried && $("start").hidden === false && !starting) {
      try { sessionStorage.setItem("coi", "1"); } catch (e) {}
      if (navigator.serviceWorker.controller) location.reload();
      else navigator.serviceWorker.addEventListener("controllerchange", () => location.reload(), { once: true });
    }
  }).catch(() => {});
}
</script>
